<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Sky Outfit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #171a35;
  --panel: #21254a;
  --panel-2: #2a2f5c;
  --line: #383e6e;
  --gold: #f0b429;
  --gold-dim: #7a6432;
  --text: #f3f1ea;
  --text-dim: #9aa0cf;
  --text-faint: #656d9e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(ellipse 120% 80% at 50% -10%, #262b58 0%, var(--bg) 55%);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  min-height: 100vh;
}

/* 星點背景, 呼應遊戲的夜空氛圍 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.5px 1.5px at 45% 40%, rgba(255,255,255,.3), transparent);
  background-repeat: no-repeat;
  pointer-events: none;
  opacity: .8;
}

header {
  padding: 40px 32px 28px;
  text-align: center;
}
header h1 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 2.4rem;
  margin: 0 0 6px;
  letter-spacing: .01em;
}
header p {
  margin: 0;
  color: var(--text-dim);
  font-size: .95rem;
}

.layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 24px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 60px;
}

/* --- 側邊分類欄 --- */
nav.categories {
  position: sticky;
  top: 24px;
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
nav.categories button {
  all: unset;
  cursor: pointer;
  padding: 9px 14px;
  border-radius: 8px;
  font-size: .88rem;
  color: var(--text-dim);
  border-left: 2px solid transparent;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
nav.categories button:hover { background: var(--panel); color: var(--text); }
nav.categories button.active {
  background: var(--panel-2);
  color: var(--gold);
  border-left: 2px solid var(--gold);
  font-weight: 600;
}
nav.categories .count { color: var(--text-faint); font-variant-numeric: tabular-nums; }
nav.categories button.active .count { color: var(--gold-dim); }

/* --- 篩選列 --- */
.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  padding: 14px 16px;
  background: var(--panel);
  border-radius: 12px;
  border: 1px solid var(--line);
}
.toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
  padding: 5px 10px 5px 6px;
  border-radius: 20px;
  background: var(--panel-2);
  font-size: .82rem;
  color: var(--text-dim);
}
.toggle input { display: none; }
.toggle .dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: background .15s;
  flex-shrink: 0;
}
.toggle input:checked ~ .dot { background: var(--gold); box-shadow: 0 0 8px rgba(240,180,41,.6); }
.toggle input:checked ~ span.label { color: var(--text); }

select, .search {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: .82rem;
  font-family: inherit;
}
.search { min-width: 160px; }
select:focus, .search:focus { outline: 1px solid var(--gold); }

.result-count {
  margin-left: auto;
  color: var(--text-faint);
  font-size: .8rem;
  font-variant-numeric: tabular-nums;
}

/* --- 卡片格線 --- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 14px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 10px 12px;
  text-align: center;
  position: relative;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.card:hover {
  transform: translateY(-3px);
  border-color: var(--gold-dim);
  box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(240,180,41,.15);
}
.card .thumb {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}
.card img {
  max-width: 100%;
  max-height: 100%;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
}
.card .thumb.missing {
  color: var(--text-faint);
  font-size: .7rem;
  border: 1px dashed var(--line);
  border-radius: 10px;
  width: 100%; height: 100%;
}
.card .name {
  font-size: .74rem;
  color: var(--text-dim);
  line-height: 1.3;
  word-break: break-word;
}
.card .badges {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: flex-end;
}
.cost-badge {
  display: flex;
  align-items: center;
  gap: 3px;
  background: rgba(240,180,41,.15);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-size: .66rem;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 10px;
  font-variant-numeric: tabular-nums;
}
.cost-badge::before { content: "\2726"; font-size: .6rem; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-faint);
}

@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  nav.categories {
    position: static;
    flex-direction: row;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  nav.categories button { flex-shrink: 0; }
}
</style>
</head>
<body>

<header>
  <h1>Sky Outfit</h1>
  <p>1450 件服裝／道具，依 OutfitDefs.json 分類</p>
</header>

<div class="layout">
  <nav class="categories" id="categoryNav"></nav>

  <main>
    <div class="filters">
      <label class="toggle">
        <input type="checkbox" id="fSkyKid"><span class="dot"></span><span class="label">isSkyKid</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="fDefault"><span class="dot"></span><span class="label">isDefault</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="fCloset"><span class="dot"></span><span class="label">inCloset</span>
      </label>
      <select id="fSeason"><option value="">全部季節</option></select>
      <input class="search" id="fSearch" type="text" placeholder="搜尋名稱...">
      <span class="result-count" id="resultCount"></span>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">這個篩選組合下沒有項目</div>
  </main>
</div>

const CATEGORY_ORDER = ["body", "body_Onesie", "face", "feet", "hair", "hat", "horn", "mask", "neck", "prop", "wing"];
const CATEGORY_LABELS = {"body": "body", "body_Onesie": "body (Onesie)", "face": "face", "feet": "feet", "hair": "hair", "hat": "hat", "horn": "horn", "mask": "mask", "neck": "neck", "prop": "prop", "wing": "wing"};
const SEASONS = ["", "TwinRibbon", "_camping_26", "_moonlight_26", "anniv_20", "anniv_21", "anniv_22", "anniv_23", "anniv_24", "anniv_25", "anniv_26", "bloom_21", "bloom_22", "bloom_23", "bloom_24", "bloom_25", "bloom_26", "color_21", "color_22", "color_23", "color_24", "color_25", "color_26", "feast_19", "feast_20", "feast_21", "feast_22", "feast_23", "feast_24", "feast_25", "fortune_21", "fortune_22", "fortune_23", "fortune_24", "fortune_25", "fortune_26", "furniture", "gamescom_23", "love_21", "love_22", "love_23", "love_24", "love_25", "mischief_19", "mischief_20", "mischief_21", "mischief_22", "mischief_23", "mischief_24", "mischief_25", "moonlight_24", "moonlight_25", "moonlight_26", "music_23", "music_24", "nature_20", "nature_21", "nature_22", "nature_23", "nature_24", "nature_25", "nature_26", "personality_26", "rainbow_23", "ribbon_25", "sanrio_24", "season_02", "season_03", "season_04", "season_05", "season_06", "season_07", "season_08", "season_09", "season_10", "season_11", "season_12", "season_13", "season_14", "season_15", "season_16", "season_17", "season_18", "season_19", "season_20", "season_21", "season_22", "season_23", "season_24", "season_25", "season_26", "season_27", "season_28", "season_29", "season_30", "season_31", "style_23", "style_24", "summer_20", "summer_21", "sunlight_22", "sunlight_23", "sunlight_24", "sunlight_25", "sunlight_26", "test", "tot_24", "tot_25", "treasure_25", "treasure_26", "unused"];

let state = { category: "ALL", skyKid: false, isDefault: false, inCloset: false, season: "", search: "" };

function categoryCounts() {
  const counts = {};
  for (const it of ITEMS) counts[it.category] = (counts[it.category] || 0) + 1;
  return counts;
}

function renderNav() {
  const counts = categoryCounts();
  const nav = document.getElementById('categoryNav');
  nav.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.textContent = 'All';
  const allCount = document.createElement('span');
  allCount.className = 'count';
  allCount.textContent = ITEMS.length;
  allBtn.appendChild(allCount);
  allBtn.className = state.category === 'ALL' ? 'active' : '';
  allBtn.onclick = () => { state.category = 'ALL'; render(); };
  nav.appendChild(allBtn);

  for (const cat of CATEGORY_ORDER) {
    const btn = document.createElement('button');
    btn.className = state.category === cat ? 'active' : '';
    const labelSpan = document.createElement('span');
    labelSpan.textContent = CATEGORY_LABELS[cat] || cat;
    const countSpan = document.createElement('span');
    countSpan.className = 'count';
    countSpan.textContent = counts[cat] || 0;
    btn.appendChild(labelSpan);
    btn.appendChild(countSpan);
    btn.onclick = () => { state.category = cat; render(); };
    nav.appendChild(btn);
  }
}

function renderSeasonOptions() {
  const sel = document.getElementById('fSeason');
  for (const s of SEASONS) {
    if (!s) continue;
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  }
}

function matches(it) {
  if (state.category !== 'ALL' && it.category !== state.category) return false;
  if (state.skyKid && !it.isSkyKid) return false;
  if (state.isDefault && !it.isDefault) return false;
  if (state.inCloset && !it.inCloset) return false;
  if (state.season && it.season !== state.season) return false;
  if (state.search && !it.name.toLowerCase().includes(state.search.toLowerCase())) return false;
  return true;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const filtered = ITEMS.filter(matches);

  document.getElementById('resultCount').textContent = filtered.length + ' 項';

  grid.innerHTML = '';
  empty.style.display = filtered.length === 0 ? 'block' : 'none';

  for (const it of filtered) {
    const card = document.createElement('div');
    card.className = 'card';

    const badges = document.createElement('div');
    badges.className = 'badges';
    if (it.firstCost) {
      const b = document.createElement('div');
      b.className = 'cost-badge';
      b.textContent = it.firstCost;
      badges.appendChild(b);
    }
    if (it.secondCost) {
      const b = document.createElement('div');
      b.className = 'cost-badge';
      b.textContent = it.secondCost;
      badges.appendChild(b);
    }
    card.appendChild(badges);

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = it.image;
    img.loading = 'lazy';
    img.alt = it.name;
    img.onerror = () => {
      thumb.classList.add('missing');
      thumb.textContent = '無圖片';
      img.remove();
    };
    thumb.appendChild(img);
    card.appendChild(thumb);

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = it.name;
    card.appendChild(name);

    grid.appendChild(card);
  }
}

function render() { renderNav(); renderGrid(); }

document.getElementById('fSkyKid').addEventListener('change', e => { state.skyKid = e.target.checked; render(); });
document.getElementById('fDefault').addEventListener('change', e => { state.isDefault = e.target.checked; render(); });
document.getElementById('fCloset').addEventListener('change', e => { state.inCloset = e.target.checked; render(); });
document.getElementById('fSeason').addEventListener('change', e => { state.season = e.target.value; render(); });
document.getElementById('fSearch').addEventListener('input', e => { state.search = e.target.value; render(); });

renderSeasonOptions();
render();
</script>
